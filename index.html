<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <h1 class="game-title">TETRIS</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar a modo claro" aria-pressed="false" title="Cambiar a modo claro">
        <span id="theme-icon" class="theme-icon" aria-hidden="true">🌙</span>
      </button>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">⚡ RAYO</span>
          <div id="powerup-badge" class="powerup-badge">
            <span id="powerup-count" class="value powerup-count">0</span>
            <div class="powerup-progress">
              <div id="powerup-progress-fill" class="powerup-progress-fill"></div>
            </div>
          </div>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>R</kbd> usar rayo</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="overlay-box pause-box">
        <p id="pause-title">PAUSA</p>

        <div id="pause-main-view" class="pause-view">
          <button id="pause-resume-btn" class="menu-btn primary" type="button">Reanudar</button>
          <button id="pause-restart-btn" class="menu-btn" type="button">Reiniciar</button>
          <button id="pause-controls-btn" class="menu-btn" type="button">Ver controles</button>
          <div class="pause-level-select">
            <label for="pause-level-select">Nivel inicial</label>
            <select id="pause-level-select"></select>
          </div>
        </div>

        <div id="pause-controls-view" class="pause-view hidden">
          <ul class="controls-list">
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd><kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
            <li><kbd>R</kbd> usar rayo</li>
          </ul>
          <button id="pause-back-btn" class="menu-btn" type="button">Volver</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
  <script src="pause-menu.js"></script>
</body>
</html>
